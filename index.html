<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F3EC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Carnet" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#F5F3EC; --paper-2:#FBFAF5; --ink:#1B2333; --ink-2:#5A6178; --ink-3:#8A8FA0;
    --dot:#D8D3C4; --rule:#E5E1D5; --berry:#C0295A; --blue:#2E5E9C; --ok:#3B8C6E;
    --radius:10px;
    --mono:'Space Mono',ui-monospace,monospace;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  /* En arabe, on bascule les polices (couvrent les glyphes arabes) */
  [dir="rtl"] {
    --serif:'Noto Kufi Arabic','Fraunces',serif;
    --sans:'Noto Sans Arabic',system-ui,sans-serif;
    --mono:'Space Mono','Noto Sans Arabic',monospace; /* chiffres latins gardés en mono */
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:var(--sans); color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);
    background-size:22px 22px; background-position:-1px -1px;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 18px 90px; }

  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { font-family:var(--serif); font-weight:900; font-size:38px; letter-spacing:-.02em; margin:0; line-height:.9; }
  .brand h1 .dot { color:var(--berry); }
  .brand .sub { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:var(--ink-3); }
  .headright { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  [dir="rtl"] .headright { align-items:flex-start; }
  .today { font-family:var(--mono); font-size:12px; color:var(--ink-2); text-align:end; }
  .today b { display:block; font-size:14px; color:var(--ink); }
  .langsw { display:flex; gap:4px; }
  .langsw button { font-family:var(--mono); font-size:11px; border:1.5px solid var(--rule); background:var(--paper-2);
    color:var(--ink-2); padding:4px 9px; border-radius:6px; cursor:pointer; }
  .langsw button[aria-pressed="true"] { border-color:var(--berry); color:var(--ink); background:#fff; }
  .netdot { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--ink-3); }
  .netdot .d { width:7px; height:7px; border-radius:50%; background:var(--ink-3); }
  .netdot.on .d { background:var(--ok); } .netdot.off .d { background:var(--berry); }

  nav.tabs { display:flex; gap:4px; border-bottom:1.5px solid var(--rule); margin-bottom:22px; overflow-x:auto; }
  .tab { font-family:var(--mono); font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; padding:10px 13px;
    border:none; background:none; color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1.5px; white-space:nowrap; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--berry); }
  .tab:focus-visible { outline:2px solid var(--berry); outline-offset:2px; border-radius:3px; }

  .view { display:none; } .view.on { display:block; animation:fade .22s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:none;} }

  .card { background:var(--paper-2); border:1.5px solid var(--rule); border-radius:var(--radius); padding:18px; }
  .card + .card { margin-top:16px; }
  .card > h2 { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-2); margin:0 0 14px; font-weight:700; }

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .tile { background:var(--paper-2); border:1.5px solid var(--rule); border-radius:var(--radius); padding:15px; }
  .tile .n { font-family:var(--serif); font-weight:900; font-size:32px; line-height:1; letter-spacing:-.02em; }
  .tile .n.accent { color:var(--berry); }
  .tile .l { font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin-top:8px; }
  @media (max-width:720px){ .tiles{ grid-template-columns:repeat(2,1fr);} }

  .matrix { overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .mtable { border-collapse:collapse; }
  .mrow-label { font-size:13px; font-weight:500; padding-inline:2px 14px; white-space:nowrap; text-align:start;
    position:sticky; left:0; z-index:2; background:var(--paper-2); box-shadow:8px 0 8px -6px rgba(0,0,0,.08); }
  .mtable thead th:first-child { position:sticky; left:0; z-index:3; background:var(--paper-2); }
  [dir="rtl"] .mrow-label { left:auto; right:0; box-shadow:-8px 0 8px -6px rgba(0,0,0,.08); }
  [dir="rtl"] .mtable thead th:first-child { left:auto; right:0; }
  .mrow-label .swatch { display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:7px; vertical-align:middle; }
  .mcell { width:22px; height:22px; text-align:center; padding:0; }
  .mdot { width:13px; height:13px; border-radius:50%; margin:0 auto; border:1.5px solid var(--dot); background:transparent; }
  .mdot.done { border-color:transparent; }
  .mcol-head { font-family:var(--mono); font-size:9px; color:var(--ink-3); height:18px; vertical-align:bottom; }
  .mcol-head.month { color:var(--ink-2); font-weight:700; }
  .legend { font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-top:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .legend .k { display:inline-flex; align-items:center; gap:6px; }
  .legend .kd { width:11px; height:11px; border-radius:50%; }

  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  .card {
    display: flex;
    flex-direction: column;
  }
  .chartbox {
    flex: 1;
    position: relative;
    min-height: 280px;
  }
  .chartbox canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .grid2 > .card {
    margin: 0 !important;
    align-self: start;
  }
  .grid2 > .card > h2 {
    margin-top: 0 !important;
  }
  .chartbox { position:relative; height:200px; }
  .chartbox canvas { position:absolute; inset:0; width:100%!important; height:100%!important; }
  @media (max-width:720px){ .grid2{ grid-template-columns:1fr;} }
  .grid2 + .card { margin-top:16px; }

  .streaks { list-style:none; margin:0; padding:0; }
  .streaks li { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--rule); }
  .streaks li:last-child { border-bottom:none; }
  .streaks .sw { width:9px; height:9px; border-radius:50%; flex:none; }
  .streaks .nm { flex:1; font-size:14px; }
  .streaks .v { font-family:var(--mono); font-weight:700; font-size:14px; }
  .streaks .v .pend { font-weight:400; font-size:10px; color:var(--ink-3); letter-spacing:.02em; }

  .dayhead { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .dayhead input[type=date] { font-family:var(--mono); font-size:13px; padding:8px 10px; border:1.5px solid var(--rule); border-radius:8px; background:var(--paper-2); color:var(--ink); }
  .daynav { border:1.5px solid var(--rule); background:var(--paper-2); border-radius:8px; width:36px; height:36px; font-size:17px; cursor:pointer; color:var(--ink-2); }
  [dir="rtl"] .daynav { transform:scaleX(-1); }

  .hlist,.tasks { list-style:none; margin:0; padding:0; }
  .hlist li { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px dashed var(--rule); }
  .hlist li:last-child { border-bottom:none; }
  .check { width:26px; height:26px; border-radius:50%; border:2px solid var(--dot); background:transparent; cursor:pointer; flex:none; display:grid; place-items:center; color:#fff; font-size:14px; }
  .check.on { border-color:transparent; }
  .check:active { transform:scale(.88); }
  .hname { flex:1; font-size:15px; }
  .hname small { font-family:var(--mono); color:var(--ink-3); font-size:11px; }
  .qin { width:70px; font-family:var(--mono); font-size:14px; padding:6px 8px; border:1.5px solid var(--rule); border-radius:7px; background:var(--paper-2); color:var(--ink); text-align:end; }
  .qunit { font-family:var(--mono); font-size:11px; color:var(--ink-3); min-width:52px; }

  .moods { display:flex; gap:8px; }
  .mood { flex:1; border:1.5px solid var(--rule); background:var(--paper-2); border-radius:9px; padding:10px 0; font-size:22px; cursor:pointer; }
  .mood[aria-pressed="true"] { border-color:var(--berry); background:#fff; box-shadow:0 0 0 2px rgba(192,41,90,.12); }

  .tasks li { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .tbullet { font-family:var(--mono); background:none; border:none; cursor:pointer; font-size:15px; color:var(--ink-2); width:22px; }
  .tasks li.done .ttext { text-decoration:line-through; color:var(--ink-3); }
  .ttext { flex:1; font-size:14px; }
  .tdel { border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:14px; opacity:.5; }
  .tdel:hover { opacity:1; color:var(--berry); }
  .taskadd { display:flex; gap:8px; margin-top:6px; }
  .taskadd input { flex:1; }

  textarea, input.text { font-family:var(--sans); font-size:14px; width:100%; border:1.5px solid var(--rule); border-radius:8px; padding:10px 12px; background:var(--paper-2); color:var(--ink); resize:vertical; }
  textarea { min-height:88px; }
  input.text:focus, textarea:focus, .qin:focus { outline:none; border-color:var(--berry); }

  .mform { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
  @media (max-width:720px){ .mform{ grid-template-columns:1fr 1fr;} }
  .field label { display:block; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin-bottom:5px; }
  .field input,.field select { width:100%; font-family:var(--sans); font-size:14px; padding:9px 10px; border:1.5px solid var(--rule); border-radius:8px; background:var(--paper-2); color:var(--ink); }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; }
  .colorrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .cpick { width:30px; height:30px; padding:0; border:1.5px solid var(--rule); border-radius:8px; background:var(--paper-2); cursor:pointer; }
  .cpick::-webkit-color-swatch-wrapper { padding:0; }
  .cpick::-webkit-color-swatch { border:none; border-radius:6px; }
  .cpick::-moz-color-swatch { border:none; border-radius:6px; }
  .swatches button { width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatches button[aria-pressed="true"] { border-color:var(--ink); }

  .btn { font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--berry); border-color:var(--berry); }
  .btn:focus-visible { outline:2px solid var(--berry); outline-offset:2px; }

  .htable { width:100%; border-collapse:collapse; margin-top:16px; }
  .htable th { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); text-align:start; padding:8px 10px; border-bottom:1.5px solid var(--rule); }
  .htable td { padding:10px; border-bottom:1px dashed var(--rule); font-size:14px; }
  .impsel { font-family:var(--mono); font-size:12px; padding:5px 7px; border:1.5px solid var(--rule); border-radius:7px; background:var(--paper-2); color:var(--ink); }
  .impsel:focus { outline:none; border-color:var(--berry); }
  .toggle { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.05em; border:1.5px solid var(--rule);
    background:var(--paper-2); color:var(--ink-3); padding:4px 10px; border-radius:20px; cursor:pointer; min-width:42px; }
  .toggle.on { border-color:var(--ok); color:#fff; background:var(--ok); }
  .htable tr.hoff td:not(:last-child):not(:nth-last-child(2)) { opacity:.45; }
  .daysel { display:flex; gap:5px; flex-wrap:wrap; }
  .dbtn { font-family:var(--mono); font-size:11px; border:1.5px solid var(--rule); background:var(--paper-2); color:var(--ink-3);
    padding:6px 9px; border-radius:7px; cursor:pointer; text-transform:capitalize; }
  .dbtn[aria-pressed="true"] { border-color:var(--berry); color:var(--ink); background:#fff; }
  .mna { display:inline-block; width:13px; text-align:center; color:var(--ink-3); opacity:.5; font-size:11px; }
  .skipbtn { border:1.5px solid var(--rule); background:var(--paper-2); color:var(--ink-3); width:28px; height:28px;
    border-radius:50%; cursor:pointer; font-size:14px; flex:none; line-height:1; }
  .skipbtn.on { border-color:var(--berry); color:var(--berry); background:#fff; }
  .hlist li.skipped .hname, .hlist li.rest .hname { color:var(--ink-3); }
  .hlist li.skipped .check, .hlist li.skipped .qin { opacity:.4; }
  .daytag { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
    border:1px solid var(--rule); border-radius:20px; padding:2px 7px; margin-inline-start:6px; background:transparent; }
  .daytag.restdo { cursor:pointer; }
  .daytag.restdo:hover { border-color:var(--berry); color:var(--berry); }
  .htable .cdot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .link { border:none; background:none; color:var(--ink-3); font-family:var(--mono); font-size:11px; cursor:pointer; text-decoration:underline; }
  .link:hover { color:var(--berry); }
  .empty { color:var(--ink-3); font-size:14px; font-style:italic; padding:8px 0; }

  .headmeta { display:flex; align-items:center; gap:10px; }
  .login { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:var(--paper); background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);
    background-size:22px 22px; padding:20px; }
  .login-card { width:100%; max-width:340px; background:var(--paper-2); border:1.5px solid var(--rule);
    border-radius:14px; padding:26px 24px; display:flex; flex-direction:column; gap:12px; }
  .login-brand { font-family:var(--serif); font-weight:900; font-size:34px; letter-spacing:-.02em; line-height:1; }
  .login-card h2 { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.16em;
    color:var(--ink-2); margin:0 0 4px; font-weight:700; }
  .login-card .btn { width:100%; }
  .login-msg { font-family:var(--mono); font-size:12px; color:var(--berry); min-height:16px; }
  .login-hint { font-size:12px; color:var(--ink-3); margin:6px 0 0; line-height:1.5; }

  .rangebar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .ranges { display:flex; gap:4px; flex-wrap:wrap; }
  .ranges button { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    border:1.5px solid var(--rule); background:var(--paper-2); color:var(--ink-2); padding:7px 12px; border-radius:8px; cursor:pointer; }
  .ranges button[aria-pressed="true"] { border-color:var(--berry); color:var(--ink); background:#fff; }
  .rangeavg { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); }
  .rangeavg #rangeAvg { font-family:var(--serif); font-weight:900; font-size:22px; letter-spacing:-.01em; color:var(--berry); text-transform:none; }

  /* ---- Responsive : téléphone / petite tablette ---- */
  @media (max-width:600px){
    .wrap { padding:16px 13px 88px; }
    header.top { flex-direction:column; align-items:flex-start; gap:12px; }
    .headright { align-items:flex-start; width:100%; }
    [dir="rtl"] .headright { align-items:flex-end; }
    .today { text-align:start; }
    [dir="rtl"] .today { text-align:end; }
    .brand h1 { font-size:32px; }
    nav.tabs { gap:0; }
    .tab { padding:10px 11px; font-size:11px; }
    .tiles { grid-template-columns:repeat(2,1fr); gap:10px; }
    .tile { padding:13px; }
    .tile .n { font-size:26px; }
    .card { padding:15px 14px; }
    .card > h2 { font-size:10px; }
    .mform { grid-template-columns:1fr; gap:12px; }
    .swatches { gap:8px; }
    .colorrow .cpick { width:64px !important; height:34px; flex:none; }
    .swatches button { width:26px; height:26px; }
    .hlist li { gap:9px; }
    .hname { font-size:14px; }
    .qin { width:60px; }
    .qunit { min-width:44px; }
    .moods .mood { font-size:20px; padding:9px 0; }
    .dayhead input[type=date] { flex:1; }
    /* Tableau des habitudes -> cartes empilées */
    .htable thead { display:none; }
    .htable, .htable tbody, .htable tr, .htable td { display:block; width:100%; }
    .htable tr { border:1.5px solid var(--rule); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
    .htable tr.hoff { opacity:.6; }
    .htable tr.hoff td { opacity:1; }
    .htable td { border:none; padding:6px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; }
    .htable td::before { content:attr(data-label); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); }
    .htable td.acts { justify-content:flex-end; gap:16px; border-top:1px dashed var(--rule); margin-top:6px; padding-top:10px; }
    .htable td.acts::before { content:''; }
    .htable td .nm { font-weight:600; }
  }
  @media (max-width:360px){
    .tiles { grid-template-columns:1fr; }
    .brand h1 { font-size:28px; }
  }
</style>
</head>
<body>
<div class="login" id="login" style="display:none">
  <div class="login-card">
    <div class="login-brand">Carnet<span style="color:var(--berry)">.</span></div>
    <h2 data-i18n="li_title"></h2>
    <input class="text" id="liEmail" type="email" autocomplete="username" data-i18n-ph="li_email" />
    <input class="text" id="liPass" type="password" autocomplete="current-password" data-i18n-ph="li_pass" />
    <div id="loginMsg" class="login-msg"></div>
    <button class="btn" id="liSignin" data-i18n="li_signin"></button>
    <button class="btn ghost" id="liSignup" data-i18n="li_signup"></button>
    <p class="login-hint" data-i18n="li_hint"></p>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Carnet<span class="dot">.</span></h1>
      <span class="sub" data-i18n="tagline"></span>
    </div>
    <div class="headright">
      <div class="langsw" id="langsw">
        <button data-lang="fr" lang="fr">FR</button>
        <button data-lang="en" lang="en">EN</button>
        <button data-lang="ar" lang="ar">ع</button>
      </div>
      <div class="today" id="today"></div>
      <div class="headmeta">
        <span class="netdot" id="netdot"><span class="d"></span><span id="netlabel"></span></span>
        <button class="link" id="logout" style="display:none" data-i18n="logout"></button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-view="dash"   data-i18n="tab_dash"></button>
    <button class="tab" role="tab" aria-selected="false" data-view="day"    data-i18n="tab_day"></button>
    <button class="tab" role="tab" aria-selected="false" data-view="habits" data-i18n="tab_habits"></button>
  </nav>

  <section class="view on" id="view-dash">
    <div class="tiles" id="tiles"></div>
    <div class="card">
      <h2 data-i18n="matrix_title"></h2>
      <div class="matrix" id="matrix"></div>
      <div class="legend">

/* ---- KV local : window.storage (aperçu) sinon localStorage (self-host) ---- */
const KV = {
  async get(k){ if(typeof window.storage!=='undefined'){ try{const r=await window.storage.get(k);return r?r.value:null}catch{return null} } try{return localStorage.getItem(k)}catch{return null} },
  async set(k,v){ if(typeof window.storage!=='undefined'){ try{await window.storage.set(k,v)}catch(e){console.error(e)} return } try{localStorage.setItem(k,v)}catch(e){console.error(e)} }
};
const KEY='carnet:v1', OUTBOX='carnet:outbox', LANGKEY='carnet:lang';

/* ---- Supabase : lecture de l'état complet ---- */
async function supaGetState(){
  const [h,l,d,tk] = await Promise.all([
    supa.from('habits').select('id,name,type,unit,target,color,position,importance,active,active_days').eq('archived',false).order('position'),
    supa.from('logs').select('day,habit_id,value'),
    supa.from('days').select('day,mood,note'),
    supa.from('tasks').select('id,day,txt,done').order('position')
  ]);
  for(const r of [h,l,d,tk]) if(r.error) throw r.error;
  const habits = h.data.map(x=>({id:x.id,name:x.name,type:x.type,unit:x.unit||'',target:Number(x.target||1),color:x.color,importance:Number(x.importance||1),active:x.active!==false,activeDays:(x.active_days!=null&&x.active_days!=='')?String(x.active_days).split(',').map(Number):[0,1,2,3,4,5,6]}));
  const days = {};
  const touch = k => { if(!days[k]) days[k]={h:{},mood:null,note:'',tasks:[]}; };
  for(const r of l.data){ touch(r.day); const v=r.value; days[r.day].h[r.habit_id] = (v!=null && v!=='' && !isNaN(v)) ? Number(v) : v; }
  for(const r of d.data){ touch(r.day); days[r.day].mood = r.mood==null?null:Number(r.mood); days[r.day].note = r.note||''; }
  for(const r of tk.data){ touch(r.day); days[r.day].tasks.push({id:r.id, t:r.txt, done:!!r.done}); }
  return { habits, days };
}

/* ---- Supabase : application d'une opération d'écriture ---- */
async function applyOp(op){
  const p = op.payload; let res;
  switch(op.kind){
    case 'habit':    res = await supa.from('habits').upsert({id:p.id,user_id:UID,name:p.name,type:p.type,unit:p.unit,target:p.target,color:p.color,importance:p.importance||1,active:p.active!==false,active_days:(p.activeDays||[0,1,2,3,4,5,6]).join(',')}); break;
    case 'habitDel': res = await supa.from('habits').delete().eq('id',p.id); break;
    case 'log':
      if(p.value==null) res = await supa.from('logs').delete().eq('user_id',UID).eq('day',p.day).eq('habit_id',p.habit_id);
      else res = await supa.from('logs').upsert({user_id:UID,day:p.day,habit_id:p.habit_id,value:String(p.value)},{onConflict:'user_id,day,habit_id'});
      break;
    case 'day':      res = await supa.from('days').upsert({user_id:UID,day:p.day,mood:p.mood,note:p.note},{onConflict:'user_id,day'}); break;
    case 'taskAdd':  res = await supa.from('tasks').insert({id:p.id,user_id:UID,day:p.day,txt:p.txt}); break;
    case 'taskUpd':  res = await supa.from('tasks').update({done:p.done}).eq('id',p.id); break;
    case 'taskDel':  res = await supa.from('tasks').delete().eq('id',p.id); break;
  }
  if(res && res.error) throw res.error;
}

/* file d'attente hors-ligne (rejoue les écritures quand le réseau revient) */
let outbox=[];
async function loadOutbox(){ const raw=await KV.get(OUTBOX); outbox = raw?JSON.parse(raw):[]; }
async function saveOutbox(){ await KV.set(OUTBOX, JSON.stringify(outbox)); }
function enqueue(op){ outbox.push(op); saveOutbox(); }
async function flushOutbox(){
  while(outbox.length){
    try{ await applyOp(outbox[0]); outbox.shift(); await saveOutbox(); }
    catch{ return false; }
  }
  return true;
}

/* ---- ÉTAT ---- */
const PALETTE=['#C0295A','#D14D3B','#CE922F','#8A7A2E','#6E7B3A','#3B8C6E','#2E9C8E','#2E5E9C','#4A6FA5','#7A4CA0','#B0568C','#556070'];
let state=null, online=true;
function id(){ return Math.random().toString(36).slice(2,9); }

async function loadLocal(){ const raw=await KV.get(KEY); if(raw){try{return JSON.parse(raw)}catch{}} return {habits:[],days:{}}; }
async function saveLocal(){ await KV.set(KEY, JSON.stringify(state)); }
let lt=null; function saveLocalSoon(){ clearTimeout(lt); lt=setTimeout(saveLocal,300); }

async function load(){
  await loadOutbox();
  if(MODE==='supabase'){
    await flushOutbox();
    try{ state = await supaGetState(); online=true; await saveLocal(); }
    catch{ state = await loadLocal(); online=false; }
  } else {
    state = await loadLocal(); online = true;
  }
  state.habits=state.habits||[]; state.days=state.days||{};
  setNet();
}
function setNet(){
  const el=document.getElementById('netdot'), lbl=document.getElementById('netlabel');
  let label;
  if(MODE!=='supabase'){ el.className='netdot'; label=t('net_local'); }
  else if(online){ el.className='netdot on'; label=t('net_synced'); }
  else { el.className='netdot off'; label=t('net_offline'); }
  lbl.textContent=label;
}

/* ---- helpers date ---- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return keyOf(new Date());}
function parseKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function lastNKeys(n){const out=[];const b=new Date();for(let i=n-1;i>=0;i--){const d=new Date(b);d.setDate(d.getDate()-i);out.push(keyOf(d));}return out;}
function day(k){ if(!state.days[k]) state.days[k]={h:{},mood:null,note:'',tasks:[]}; const d=state.days[k]; d.h=d.h||{}; d.tasks=d.tasks||[]; if(d.note==null)d.note=''; return d; }
function dayRO(k){return state.days[k]||null;}

/* ---- calculs ---- */
const SKIP='SKIP';
function isSkip(v){ return v===SKIP; }
// v "réellement renseigné" (fait/saisi) ? (SKIP n'est pas un log)
function hasLog(h,v){ if(v==null||v===''||v===false||v===SKIP) return false; if(h.type==='binary') return !!v; return true; }
function isDone(h,v){ if(v==null||v===false||v===SKIP)return false; if(h.type==='binary')return !!v; return Number(v)>=Number(h.target||1); }
function hv(k,hid){const d=dayRO(k);return d&&d.h?d.h[hid]:undefined;}
// Jours de la semaine où l'habitude s'applique (getDay: 0=dim..6=sam). Absent => tous.
function activeDaysOf(h){ return (Array.isArray(h.activeDays)&&h.activeDays.length)?h.activeDays:[0,1,2,3,4,5,6]; }
// Est-ce que l'habitude "compte" ce jour-là ? (planning + skip + exception si renseignée)
function counts(h,k){
  if(h.active===false) return false;              // OFF global
  const v=hv(k,h.id);
  if(v===SKIP) return false;                      // "ne pas compter aujourd'hui"
  if(hasLog(h,v)) return true;                    // faite/saisie -> compte même hors planning
  return activeDaysOf(h).includes(parseKey(k).getDay()); // sinon : selon le planning
}
// Poids selon l'importance : 1 -> 100%, 4 -> 75%, 2 -> 50%, 3 -> 25%
// (4 ajouté après coup pour le 75% ; les niveaux 1/2/3 gardent leur sens d'origine)
const WEIGHT={1:1,4:0.75,2:0.5,3:0.25};
function weightOf(h){ return WEIGHT[h.importance||1] || 1; }
// Habitudes actives (ON). Une habitude OFF (active===false) est ignorée partout sauf dans la gestion.
function activeHabits(){ return state.habits.filter(h=>h.active!==false); }
// Progression d'une habitude sur un jour, entre 0 et 1
// binaire : 0 ou 1 ; quantifiée : valeur/objectif plafonné à 1 (ex. 6h/8h = 0.75)
function progress(h,v){
  if(v==null||v===false||v===SKIP) return 0;
  if(h.type==='binary') return v?1:0;
  const f=Number(v)/Number(h.target||1);
  return Math.max(0, Math.min(1, isNaN(f)?0:f));
}
// Taux de complétion pondéré par l'importance ET proportionnel à la progression
function completion(k){
  let tot=0, done=0;
  for(const h of activeHabits()){
    if(!counts(h,k)) continue;                    // jour non applicable / skip -> ignoré
    const w=weightOf(h); tot+=w; done += w*progress(h, hv(k,h.id));
  }
  return tot ? done/tot : 0;
}
function streak(h){
  let n=0; const d=new Date(); const today=keyOf(d);
  for(let i=0;i<400;i++){ const k=keyOf(d);
    if(!counts(h,k)){ d.setDate(d.getDate()-1); continue; }        // inactif / skip / hors-planning -> neutre
    if(isDone(h,hv(k,h.id))){ n++; d.setDate(d.getDate()-1); continue; }
    if(k===today){ d.setDate(d.getDate()-1); continue; }           // jour en cours non fini -> ignoré, pas une rupture
    break;                                                          // vraie rupture (jour échu, actif, non skip, non validé)
  }
  return n;
}
// Le jour en cours reste-t-il à faire ? (jour actif, non skip, pas encore validé)
function todayPending(h){ const k=todayKey(); return counts(h,k) && !isDone(h,hv(k,h.id)); }
function moodAvg(keys){ const v=keys.map(k=>{const d=dayRO(k);return d?d.mood:null;}).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function rgba(hex,a){const h=hex.replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ============================================================
   COMMITS — mutation locale immédiate + écriture Supabase (ou file d'attente)
   ============================================================ */
function push(kind, payload){
  if(MODE!=='supabase') return;              // mode local : rien à synchroniser
  enqueue({kind, payload});
  flushOutbox().then(ok=>{ if(ok!==online){ online=ok; setNet(); } });
}
function commitHabit(h){ push('habit', {id:h.id,name:h.name,type:h.type,unit:h.unit,target:h.target,color:h.color,importance:h.importance||1,active:h.active!==false,activeDays:Array.isArray(h.activeDays)?h.activeDays:[0,1,2,3,4,5,6]}); }

function applyI18n(){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==='ar')?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById('taskInput').placeholder = t('task_ph');
  document.getElementById('dayNote').placeholder = t('note_ph');
  document.getElementById('hName').placeholder = t('name_ph');
  document.getElementById('hUnit').placeholder = t('unit_ph');
  document.querySelectorAll('#langsw button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  renderToday(); setNet();
}
function renderToday(){
  const d=new Date();
  const full=d.toLocaleDateString(I18N[lang].loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('today').innerHTML=`<b>${full}</b>${keyOf(d)}`;
}

function renderTiles(){
  const hs=activeHabits();
  const streaks=hs.map(streak); const best=streaks.length?Math.max(...streaks):0;
  const m=moodAvg(lastNKeys(7));
  const data=[
    {n:hs.length,l:t('tile_habits')},
    {n:Math.round(completion(todayKey())*100)+'%',l:t('tile_done'),a:true},
    {n:best,l:t('tile_streak')},
    {n:m==null?'—':m.toFixed(1),l:t('tile_mood')} ];
  document.getElementById('tiles').innerHTML=data.map(x=>`<div class="tile"><div class="n${x.a?' accent':''}">${x.n}</div><div class="l">${x.l}</div></div>`).join('');
}
function renderMatrix(){
  const box=document.getElementById('matrix');
  const hs=activeHabits();
  if(!hs.length){ box.innerHTML=`<p class="empty">${t('empty_no_habits')}</p>`; return; }
  const keys=lastNKeys(35);
  let head='<tr><th></th>';
  keys.forEach(k=>{ const d=parseKey(k); const first=d.getDate()===1;
    head+=`<th class="mcol-head${first?' month':''}">${first?I18N[lang].months[d.getMonth()]:(d.getDay()===1?d.getDate():'')}</th>`; });
  head+='</tr>';
  let rows='';
  for(const h of hs){
    let c=`<td class="mrow-label"><span class="swatch" style="background:${h.color}"></span>${esc(h.name)}</td>`;
    for(const k of keys){
      const v=hv(k,h.id);
      // jour non applicable (planning/skip) et non renseigné -> case neutre
      if(!counts(h,k)){
        const na = v===SKIP ? '⊘' : '·';
        c+=`<td class="mcell"><span class="mna" title="${esc(h.name)} · ${k}">${na}</span></td>`;
        continue;
      }
      let cls='mdot', st='', ttl=`${esc(h.name)} · ${k}`;
      if(h.type==='binary'){
        if(isDone(h,v)){ cls+=' done'; st=`background:${h.color}`; }
      } else {
        const num=(v==null||v==='')?0:Number(v), tgt=Number(h.target||1);
        const f=Math.max(0,Math.min(1, tgt?num/tgt:0));
        if(f>=1){ cls+=' done'; st=`background:${h.color}`; }
        else if(f>0){ const pct=Math.round(f*100); st=`background:linear-gradient(to top, ${h.color} 0 ${pct}%, transparent ${pct}% 100%)`; }
        if(num) ttl+=` · ${num}/${tgt}`;
      }
      c+=`<td class="mcell"><div class="${cls}" style="${st}" title="${ttl}"></div></td>`;
    }
    rows+=`<tr>${c}</tr>`;
  }
  box.innerHTML=`<table class="mtable"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}
function renderStreaks(){
  const el=document.getElementById('streaks');
  const hs=activeHabits();
  if(!hs.length){ el.innerHTML=`<li class="empty">—</li>`; return; }
  el.innerHTML=hs.map(h=>({h,s:streak(h),p:todayPending(h)})).sort((a,b)=>b.s-a.s)
    .map(({h,s,p})=>`<li><span class="sw" style="background:${h.color}"></span><span class="nm">${esc(h.name)}</span><span class="v">${s}${p?` <small class="pend">· ${t('pending_today')}</small>`:''}</span></li>`).join('');
}
let cComp=null,cMood=null,compRange='month';
// Jours couverts par la période choisie
function rangeKeys(r){
  if(r==='week') return lastNKeys(7);
  if(r==='3m')   return lastNKeys(90);
  if(r==='6m')   return lastNKeys(180);
  // 'month' = du 1er du mois en cours à aujourd'hui (temps réel)
  const now=new Date(); const out=[];
  for(let d=1; d<=now.getDate(); d++) out.push(keyOf(new Date(now.getFullYear(), now.getMonth(), d)));
  return out;
}
function renderCharts(){
  if(typeof Chart==='undefined')return;
  Chart.defaults.font.family="'Space Mono',monospace"; Chart.defaults.font.size=10; Chart.defaults.color='#8A8FA0';
  const rtl=(lang==='ar');
  const keys=rangeKeys(compRange);
  const labels=keys.map(k=>{const d=parseKey(k);return d.getDate()===1?I18N[lang].months[d.getMonth()]:d.getDate();});
  const long=keys.length>40;

  // Taux de complétion (pondéré par importance) + moyenne de la période
  const comp=keys.map(k=>Math.round(completion(k)*100));
  const avg=comp.length?Math.round(comp.reduce((a,b)=>a+b,0)/comp.length):0;
  const av=document.getElementById('rangeAvg'); if(av) av.textContent=avg+'%';

  if(cComp)cComp.destroy();
  cComp=new Chart(document.getElementById('chartComp'),{type:'line',
    data:{labels,datasets:[{data:comp,borderColor:'#C0295A',backgroundColor:'rgba(192,41,90,.12)',tension:.35,fill:true,spanGaps:true,pointRadius:long?0:3,pointBackgroundColor:'#C0295A'}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:10,bottom:6}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+' %'}}},
      scales:{y:{beginAtZero:true,max:105,grid:{color:'#E5E1D5'},afterFit:s=>{s.width=44;},ticks:{stepSize:10,callback:v=>v<=100?v+'%':''}},x:{reverse:rtl,grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:long?8:12}}}}});

  // Humeur sur la même période
  const mood=keys.map(k=>{const d=dayRO(k);return d&&d.mood!=null?d.mood:null;});
  if(cMood)cMood.destroy();
  cMood=new Chart(document.getElementById('chartMood'),{type:'line',
    data:{labels,datasets:[{data:mood,borderColor:'#2E5E9C',backgroundColor:'rgba(46,94,156,.12)',tension:.35,fill:true,spanGaps:true,pointRadius:long?0:3,pointBackgroundColor:'#2E5E9C'}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:10,bottom:6}},plugins:{legend:{display:false}},scales:{y:{min:1,max:5.5,grid:{color:'#E5E1D5'},afterFit:s=>{s.width=44;},ticks:{stepSize:1,callback:v=>v<=5?v:''}},x:{reverse:rtl,grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:long?8:12}}}}});
}
function renderDash(){ renderTiles(); renderMatrix(); renderStreaks(); renderCharts(); }

let curDay=todayKey();
const MOOD={1:'😞',2:'😕',3:'😐',4:'🙂',5:'😄'};
function renderDay(){
  document.getElementById('dayDate').value=curDay;
  const d=day(curDay), hl=document.getElementById('dayHabits');
  const hs=activeHabits();
  const wd=parseKey(curDay).getDay();
  if(!hs.length){ hl.innerHTML=`<li class="empty">${t('empty_create_first')}</li>`; }
  else{
    hl.innerHTML=hs.map(h=>{ const v=d.h[h.id];
      const skipped = v===SKIP;
      const scheduled = activeDaysOf(h).includes(wd);   // applicable aujourd'hui selon planning
      const rest = !scheduled && !skipped && !hasLog(h,v); // jour "repos" (hors planning, non renseignée)
      const liCls = (skipped?'skipped ':'')+(rest?'rest':'');
      const tag = skipped ? `<small class="daytag">${t('skipped')}</small>` : (rest? `<button class="daytag restdo" data-restdo="${h.id}" title="${t('rest_do')}">${t('rest')}</button>` : '');
      // bouton skip (⊘) : neutralise / réactive ce jour
      const skipBtn = `<button class="skipbtn${skipped?' on':''}" data-skip="${h.id}" title="${t('skip_day')}">⊘</button>`;
      if(h.type==='binary'){ const on=isDone(h,v);
        return `<li class="${liCls}"><button class="check${on?' on':''}" data-toggle="${h.id}" style="${on?'background:'+h.color:''}" aria-pressed="${on}">${on?'✓':''}</button><span class="hname">${esc(h.name)} ${tag}</span>${skipBtn}</li>`; }
      const done=isDone(h,v);
      return `<li class="${liCls}"><button class="check${done?' on':''}" style="${done?'background:'+h.color:''}" aria-hidden="true">${done?'✓':''}</button><span class="hname">${esc(h.name)} <small>${t('obj')} ${h.target} ${esc(h.unit)}</small> ${tag}</span><input class="qin" type="number" min="0" data-quant="${h.id}" value="${(v!=null&&v!==SKIP)?v:''}" /><span class="qunit">${esc(h.unit)}</span>${skipBtn}</li>`;
    }).join('');
  }
  document.getElementById('moods').innerHTML=[1,2,3,4,5].map(m=>`<button class="mood" data-mood="${m}" aria-pressed="${d.mood===m}">${MOOD[m]}</button>`).join('');
  const tl=document.getElementById('taskList');
  tl.innerHTML=d.tasks.length?d.tasks.map(x=>`<li class="${x.done?'done':''}"><button class="tbullet" data-task="${x.id}">${x.done?'✓':'•'}</button><span class="ttext">${esc(x.t)}</span><button class="tdel" data-taskdel="${x.id}">✕</button></li>`).join(''):`<li class="empty">${t('empty_none')}</li>`;
  document.getElementById('dayNote').value=d.note||'';
}

function switchView(v){
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.view===v));

  if(v==='dash')renderDash(); if(v==='day')renderDay(); if(v==='habits')renderHabits();
}

  renderCharts();
});

  lang=b.dataset.lang; KV.set(LANGKEY,lang); applyI18n();
  const cur=document.querySelector('.tab[aria-selected="true"]').dataset.view; switchView(cur); });

document.getElementById('view-day').addEventListener('click',e=>{ const d=day(curDay);
  const tog=e.target.closest('[data-toggle]');
  if(tog){ const hid=tog.dataset.toggle; const h=state.habits.find(x=>x.id===hid);
    const nowDone=isDone(h,d.h[hid]); d.h[hid]=nowDone?false:true;
    saveLocalSoon(); commitLog(curDay,hid,d.h[hid]?1:null); renderDay(); return; }
  const rd=e.target.closest('[data-restdo]');
  if(rd){ const hid=rd.dataset.restdo; const h=state.habits.find(x=>x.id===hid);
    if(h && h.type==='binary'){ d.h[hid]=true; saveLocalSoon(); commitLog(curDay,hid,1); renderDay(); }
    else { const inp=document.querySelector('[data-quant="'+hid+'"]'); if(inp){ inp.focus(); } }
    return; }
  const sk=e.target.closest('[data-skip]');
  if(sk){ const hid=sk.dataset.skip;
    if(d.h[hid]===SKIP){ d.h[hid]=null; commitLog(curDay,hid,null); }      // réactiver ce jour
    else { d.h[hid]=SKIP; commitLog(curDay,hid,SKIP); }                    // ne pas compter aujourd'hui
    saveLocalSoon(); renderDay(); return; }
  const mo=e.target.closest('[data-mood]');
  if(mo){ const m=+mo.dataset.mood; d.mood=(d.mood===m?null:m); saveLocalSoon(); commitDay(curDay,d.mood,d.note); renderDay(); return; }
  const tk=e.target.closest('[data-task]');
  if(tk){ const x=d.tasks.find(y=>y.id===tk.dataset.task); if(x){x.done=!x.done; saveLocalSoon(); commitTaskUpd(x.id,x.done); renderDay();} return; }
  const td=e.target.closest('[data-taskdel]');
  if(td){ d.tasks=d.tasks.filter(y=>y.id!==td.dataset.taskdel); saveLocalSoon(); commitTaskDel(td.dataset.taskdel); renderDay(); return; }
});

let editingId=null;
function resetHabitForm(){
  document.getElementById('hName').value=''; document.getElementById('hUnit').value=''; document.getElementById('hTarget').value=''; document.getElementById('hImp').value='1';
  document.getElementById('hType').value='binary'; document.getElementById('hUnit').disabled=true; document.getElementById('hTarget').disabled=true;

  const cp=document.getElementById('hColorPicker'); if(cp) cp.value=PALETTE[0];
}
function exitEdit(){
  editingId=null;
  document.querySelector('#view-habits h2').textContent=t('new_habit');
  document.getElementById('hAdd').textContent=t('create_habit');
  document.getElementById('hCancel').style.display='none';
  resetHabitForm(); renderSwatches();
}
function startEdit(hid){
  const h=state.habits.find(x=>x.id===hid); if(!h)return;
  editingId=hid;
  document.getElementById('hName').value=h.name;
  document.getElementById('hType').value=h.type;
  const q=h.type==='quant';
  document.getElementById('hUnit').disabled=!q; document.getElementById('hTarget').disabled=!q;
  document.getElementById('hUnit').value=h.unit||''; document.getElementById('hTarget').value=q?(h.target||1):'';
  document.getElementById('hImp').value=String(h.importance||1);
  newColor=h.color; renderSwatches();
  const cp=document.getElementById('hColorPicker'); if(cp && /^#[0-9a-fA-F]{6}$/.test(h.color||'')) cp.value=h.color;
  newDays=new Set((Array.isArray(h.activeDays)&&h.activeDays.length)?h.activeDays:[0,1,2,3,4,5,6]); renderDaySel();
  document.querySelector('#view-habits h2').textContent=t('edit_habit');
  document.getElementById('hAdd').textContent=t('save_habit');
  document.getElementById('hCancel').style.display='';
  document.getElementById('hName').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('hCancel').addEventListener('click',exitEdit);

document.getElementById('hAdd').addEventListener('click',()=>{
  const name=document.getElementById('hName').value.trim(); if(!name){document.getElementById('hName').focus();return;}
  const type=document.getElementById('hType').value;
  const importance=Number(document.getElementById('hImp').value)||1;
  const unit=type==='quant'?(document.getElementById('hUnit').value.trim()||''):'';
  const target=type==='quant'?(Number(document.getElementById('hTarget').value)||1):1;
  const activeDays=Array.from(newDays).sort((a,b)=>a-b);
  if(editingId){
    const h=state.habits.find(x=>x.id===editingId); if(h){ Object.assign(h,{name,type,unit,target,color:newColor,importance,activeDays}); saveLocal(); commitHabit(h); }
    exitEdit();
  } else {
    const h={id:id(),name,type,color:newColor,unit,target,importance,active:true,activeDays};
    state.habits.push(h); saveLocal(); commitHabit(h);
    resetHabitForm();
  }
  renderHabits();
});
document.getElementById('habitTable').addEventListener('click',e=>{
  const ed=e.target.closest('[data-hedit]');
  if(ed){ startEdit(ed.dataset.hedit); return; }
  const tg=e.target.closest('[data-hactive]');
  if(tg){ const h=state.habits.find(x=>x.id===tg.dataset.hactive); if(h){ h.active=(h.active===false); saveLocal(); commitHabit(h); renderHabits(); renderDash(); } return; }
  const del=e.target.closest('[data-hdel]'); if(!del)return;
  const h=state.habits.find(x=>x.id===del.dataset.hdel);
  if(h&&confirm(t('delete')+' « '+h.name+' » ?')){ if(editingId===del.dataset.hdel) exitEdit(); state.habits=state.habits.filter(x=>x.id!==del.dataset.hdel); saveLocal(); commitHabitDel(del.dataset.hdel); renderHabits(); }});
document.getElementById('habitTable').addEventListener('change',e=>{ const s=e.target.closest('[data-himp]'); if(!s)return;
  const h=state.habits.find(x=>x.id===s.dataset.himp); if(!h)return;
  h.importance=Number(s.value)||1; saveLocal(); commitHabit(h);
  const cur=document.querySelector('.tab[aria-selected="true"]').dataset.view; if(cur==='dash') renderDash();
});

  document.getElementById('loginMsg').textContent = '…';

  if(kind==='signup' && !data.session){
    document.getElementById('loginMsg').textContent = lang==='ar'?'تحقّق من بريدك لتأكيد الحساب':(lang==='en'?'Check your inbox to confirm your account':'Vérifie ta boîte mail pour confirmer le compte');
  }
  // onAuthStateChange enchaîne startApp() si session ok
}

  switchView('dash');
  if(CFG.REALTIME && MODE==='supabase') subscribeRealtime();
  // Service worker : rend l'app installable (écran d'accueil, plein écran) + hors-ligne.
  // Stratégie "réseau d'abord" (voir sw.js) : jamais de version périmée servie en ligne.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

let rtChannel=null, rtTimer=null;
function subscribeRealtime(){
  if(rtChannel) return;
  rtChannel = supa.channel('carnet')
    .on('postgres_changes', {event:'*', schema:'public'}, ()=>{
      clearTimeout(rtTimer);
      rtTimer=setTimeout(async ()=>{
        try{ state=await supaGetState(); await saveLocal();
          const cur=document.querySelector('.tab[aria-selected="true"]').dataset.view; switchView(cur);
        }catch{}
      }, 500);
    }).subscribe();
}

async function signOut(){ if(supa){ await supa.auth.signOut(); location.reload(); } }

(async function(){
  const savedLang = await KV.get(LANGKEY); if(savedLang && I18N[savedLang]) lang=savedLang;
  applyI18n();

  if(HAS_SUPA){
    supa = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    document.getElementById('logout').style.display='';
    const { data:{ session } } = await supa.auth.getSession();
    if(session){ UID=session.user.id; MODE='supabase'; await startApp(); }
    else { showLogin(); }
    supa.auth.onAuthStateChange((_e, sess)=>{
      if(sess && MODE!=='supabase'){ UID=sess.user.id; MODE='supabase'; hideLogin(); startApp(); }
    });
  } else {
    // aperçu / self-host sans config : mode local
    MODE='local'; await startApp();
  }
})();
</script>
